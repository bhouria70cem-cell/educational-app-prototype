<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain with gradient -->
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D4EDD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="30" fill="url(#brainGradient)" opacity="0.1" stroke="url(#brainGradient)" stroke-width="3"/>
  
  <!-- Brain icon (simplified) -->
  <circle cx="70" cy="70" r="35" fill="url(#brainGradient)" opacity="0.8"/>
  <circle cx="65" cy="55" r="8" fill="#00D9FF"/>
  <circle cx="75" cy="50" r="6" fill="#00D9FF"/>
  <circle cx="85" cy="60" r="7" fill="#9D4EDD"/>
  
  <!-- Checkmark -->
  <g transform="translate(110, 85)">
    <path d="M 0 15 L 15 30 L 40 0" stroke="url(#checkGradient)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Arrow up (simplified bars) -->
  <rect x="130" y="100" width="8" height="25" fill="url(#checkGradient)" rx="2"/>
  <rect x="145" y="85" width="8" height="40" fill="url(#checkGradient)" rx="2"/>
  <rect x="160" y="70" width="8" height="55" fill="url(#checkGradient)" rx="2"/>
</svg>